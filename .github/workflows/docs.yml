name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # Mirror docs/ into the GitHub Wiki as a human-browsable surface.
      # The website no longer reads the wiki — it builds /docs from docs/ at
      # the release tag — so this no longer triggers a nitpik-web deploy.
      # nitpik-web redeploys on `release-published` (see release.yml).
      - name: Sync docs/ to wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: docs/
          token: ${{ secrets.GITHUB_TOKEN }}
