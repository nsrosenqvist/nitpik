name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write
  models: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    outputs:
      is_prerelease: ${{ steps.detect.outputs.is_prerelease }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Set version from tag
        id: detect
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # BSD sed (macOS) requires a backup extension with -i; GNU sed does not.
          if [[ "$OSTYPE" == darwin* ]]; then
            sed -i '' "1,/^version = .*/s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
          else
            sed -i "1,/^version = .*/s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
          fi

          # Detect pre-release suffix (e.g. -alpha, -beta.1, -rc.2)
          if [[ "$VERSION" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        run: |
          BIN="target/${{ matrix.target }}/release/nitpik"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip "$BIN"
          else
            strip "$BIN"
          fi

      - name: Package
        run: |
          ARCHIVE="nitpik-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" nitpik
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: nitpik-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

      - name: Upload patched manifest
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v6
        with:
          name: patched-manifest
          path: Cargo.toml

  # Bundle the matching nitpik release binary into a platform-specific VSIX so
  # the Marketplace auto-serves the right one (VS Code >=1.61). Mirrors the
  # `build` target matrix; platforms without a release binary fall back to the
  # universal VSIX below (which resolves nitpik from PATH / the `nitpik.path`
  # setting).
  package-vscode:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: x86_64-unknown-linux-gnu
            vsce_target: linux-x64
          - rust_target: aarch64-unknown-linux-gnu
            vsce_target: linux-arm64
          - rust_target: x86_64-apple-darwin
            vsce_target: darwin-x64
          - rust_target: aarch64-apple-darwin
            vsce_target: darwin-arm64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download nitpik binary for ${{ matrix.rust_target }}
        uses: actions/download-artifact@v7
        with:
          name: nitpik-${{ matrix.rust_target }}
          path: bin-artifact

      - name: Stage binary into the extension
        run: |
          mkdir -p editors/vscode/bin
          tar xzf "bin-artifact/nitpik-${{ matrix.rust_target }}.tar.gz" -C editors/vscode/bin
          chmod +x editors/vscode/bin/nitpik
          # vsce packages on a unix runner, so the executable bit is preserved
          # in the VSIX zip for both the linux and darwin payloads.

      - name: Sync extension version and license with the tag
        run: |
          # Marketplace requires a plain major.minor.patch; drop any pre-release
          # suffix so an rc tag still produces a valid (un-published) VSIX.
          VERSION="${GITHUB_REF_NAME#v}"
          CLEAN_VERSION="${VERSION%%-*}"
          cd editors/vscode
          npm version "$CLEAN_VERSION" --no-git-tag-version --allow-same-version
          cp ../../LICENSE LICENSE

      - name: Build and package VSIX
        working-directory: editors/vscode
        run: |
          npm ci
          npm run build
          # --no-dependencies: the extension is a single esbuild bundle, so vsce
          # must not try to analyze or include node_modules.
          npx --yes @vscode/vsce@3 package \
            --target ${{ matrix.vsce_target }} \
            --no-dependencies \
            -o "nitpik-${{ matrix.vsce_target }}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: vsix-${{ matrix.vsce_target }}
          path: editors/vscode/*.vsix

  # Platform-agnostic VSIX with no bundled binary, for any platform the binary
  # matrix doesn't cover (Windows, Alpine, 32-bit ARM, …). nitpik is resolved
  # from PATH or the `nitpik.path` setting.
  package-vscode-universal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync extension version and license with the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CLEAN_VERSION="${VERSION%%-*}"
          cd editors/vscode
          npm version "$CLEAN_VERSION" --no-git-tag-version --allow-same-version
          cp ../../LICENSE LICENSE

      - name: Build and package universal VSIX
        working-directory: editors/vscode
        run: |
          npm ci
          npm run build
          npx --yes @vscode/vsce@3 package \
            --no-dependencies \
            -o "nitpik-universal.vsix"

      - name: Upload universal VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: vsix-universal
          path: editors/vscode/*.vsix

  # The Claude Code plugin ships config only (no binary): validate the manifests
  # and the marketplace catalog, sync the version, and archive the plugin dir.
  package-claude-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sync plugin version with the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CLEAN_VERSION="${VERSION%%-*}"
          MANIFEST="editors/claude-code/.claude-plugin/plugin.json"
          node -e '
            const fs = require("node:fs");
            const p = process.argv[1], v = process.argv[2];
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            m.version = v;
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
          ' "$MANIFEST" "$CLEAN_VERSION"

      - name: Validate plugin and marketplace manifests
        run: |
          # Hard gate: every manifest must be valid JSON with its required keys,
          # and the marketplace must point at a real plugin directory.
          node -e '
            const fs = require("node:fs");
            const must = (cond, msg) => { if (!cond) { console.error("✗ " + msg); process.exit(1); } };

            const plugin = JSON.parse(fs.readFileSync("editors/claude-code/.claude-plugin/plugin.json", "utf8"));
            must(plugin.name, "plugin.json: missing name");
            must(plugin.version, "plugin.json: missing version");

            const mcp = JSON.parse(fs.readFileSync("editors/claude-code/.mcp.json", "utf8"));
            must(mcp.mcpServers && mcp.mcpServers.nitpik, ".mcp.json: missing mcpServers.nitpik");

            const market = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
            must(market.name, "marketplace.json: missing name");
            must(Array.isArray(market.plugins) && market.plugins.length, "marketplace.json: no plugins");
            for (const entry of market.plugins) {
              must(entry.name && entry.source, "marketplace.json: plugin needs name + source");
              if (typeof entry.source === "string") {
                must(entry.source.startsWith("./"), `marketplace.json: relative source must start with ./ (${entry.source})`);
                must(fs.existsSync(entry.source), `marketplace.json: source path not found (${entry.source})`);
              }
            }
            console.log("✓ plugin, mcp, and marketplace manifests valid");
          '

      - name: Archive plugin
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd editors && zip -r "../nitpik-claude-code-${VERSION}.zip" claude-code)

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: claude-code-plugin
          path: nitpik-claude-code-*.zip

  release:
    needs: [build, package-vscode, package-vscode-universal, package-claude-code]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          # Cover every distributable: CLI tarballs, the VSIX matrix, and the
          # Claude Code plugin archive.
          sha256sum *.tar.gz *.vsix *.zip > SHA256SUMS

      - name: Generate release notes
        uses: nsrosenqvist/chronikl@v1
        with:
          output: release_notes.md
          voice: prose
          rich_context: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHRONIKL_PROVIDER: github-models
          CHRONIKL_MODEL: openai/gpt-4o-mini

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.vsix
            artifacts/*.zip
            artifacts/SHA256SUMS

  publish:
    needs: [release, build]
    if: needs.build.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download patched manifest
        uses: actions/download-artifact@v7
        with:
          name: patched-manifest

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-vscode:
    # Publish every platform VSIX (plus the universal fallback) to the VS Code
    # Marketplace in one shot; the Marketplace serves each client the matching
    # platform build. Stable releases only, matching the other publish jobs.
    needs: [release, build]
    if: needs.build.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx --yes @vscode/vsce@3 publish \
            $(printf -- '--packagePath %s ' vsix/*.vsix)

  update-homebrew:
    needs: [release, build]
    if: needs.build.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: nsrosenqvist/homebrew-nitpik
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          FORMULA="Formula/nitpik.rb"

          # Download the checksums file from the release
          curl -sSfL "https://github.com/nsrosenqvist/nitpik/releases/download/${TAG}/SHA256SUMS" -o SHA256SUMS

          # Extract per-target checksums
          SHA_MACOS_ARM=$(grep 'aarch64-apple-darwin' SHA256SUMS | awk '{print $1}')
          SHA_MACOS_X86=$(grep 'x86_64-apple-darwin' SHA256SUMS | awk '{print $1}')
          SHA_LINUX_ARM=$(grep 'aarch64-unknown-linux-gnu' SHA256SUMS | awk '{print $1}')
          SHA_LINUX_X86=$(grep 'x86_64-unknown-linux-gnu' SHA256SUMS | awk '{print $1}')

          # Update version
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$FORMULA"

          # Replace sha256 values in order of appearance in the formula:
          # 1. macOS ARM, 2. macOS Intel, 3. Linux ARM, 4. Linux Intel
          python3 -c "
          import re
          shas = ['${SHA_MACOS_ARM}', '${SHA_MACOS_X86}', '${SHA_LINUX_ARM}', '${SHA_LINUX_X86}']
          with open('${FORMULA}') as f:
              content = f.read()
          i = 0
          def replace_sha(m):
              global i
              s = 'sha256 \"' + shas[i] + '\"'
              i += 1
              return s
          content = re.sub(r'sha256 \"[a-fA-F0-9]+\"', replace_sha, content)
          # Also handle PLACEHOLDER values (first-time setup)
          content = re.sub(r'sha256 \"PLACEHOLDER\"', replace_sha, content)
          with open('${FORMULA}', 'w') as f:
              f.write(content)
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/nitpik.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "nitpik ${GITHUB_REF_NAME}"
          git push

  update-floating-tags:
    needs: [release, build]
    if: needs.build.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update floating major and minor version tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="v${VERSION%%.*}"
          MINOR="v${VERSION%.*}"

          for TAG in "$MAJOR" "$MINOR"; do
            git tag -f "$TAG" "$GITHUB_REF_NAME"
            git push origin "$TAG" --force
          done

  notify-web:
    # Fires nitpik-web's `release-published` dispatch with the new tag in
    # the payload so the site rebuilds with the current version baked in.
    # Prerelease-gated to match the other publish jobs above.
    needs: [release, build]
    if: needs.build.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger nitpik-web deploy
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.NITPIK_WEB_DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/nsrosenqvist/nitpik-web/dispatches \
            -d "{\"event_type\":\"release-published\",\"client_payload\":{\"tag\":\"${GITHUB_REF_NAME}\"}}"
