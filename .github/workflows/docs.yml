name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  gollum:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        if: github.event_name == 'push'
        uses: actions/checkout@v6

      - name: Sync docs/ to wiki
        if: github.event_name == 'push'
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: docs/
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger nitpik-web deploy
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.NITPIK_WEB_DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/nsrosenqvist/nitpik-web/dispatches \
            -d '{"event_type":"wiki-updated"}'
