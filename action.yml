name: nitpik
description: AI-powered code review — run nitpik in your GitHub Actions workflow
author: nitpik

branding:
  icon: search
  color: purple

inputs:
  version:
    description: "nitpik version to use (e.g. 'v0.1.0', 'latest')"
    required: false
    default: latest
  args:
    description: "Arguments to pass to nitpik (default: review with GitHub format)"
    required: false
    default: ""
  profiles:
    description: "Comma-separated reviewer profiles"
    required: false
    default: backend
  diff_base:
    description: "Git ref to diff against (default: PR target branch)"
    required: false
    default: ""
  fail_on:
    description: "Exit non-zero on severity: info, warning, error"
    required: false
    default: ""
  scan_secrets:
    description: "Enable secret scanning before sending to LLM"
    required: false
    default: "false"
  agent:
    description: "Agentic-review policy: auto (honor each reviewer's own setting), on (force tools on everywhere), or off (force single-shot). Legacy true/false still accepted (true→on, false→off)."
    required: false
    default: "auto"
  pr_review:
    description: "Post findings as a real inline PR review (needs permissions: pull-requests: write). Falls back to workflow annotations when false."
    required: false
    default: "false"

# ⚠ Security: API keys (ANTHROPIC_API_KEY, OPENAI_API_KEY, etc.) must be passed
#   via GitHub Secrets — never hardcode them in workflow files.
#   See: https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions

runs:
  using: composite
  steps:
    - name: Determine diff base
      id: base
      shell: bash
      run: |
        if [ -n "${{ inputs.diff_base }}" ]; then
          echo "ref=${{ inputs.diff_base }}" >> "$GITHUB_OUTPUT"
        elif [ -n "$GITHUB_BASE_REF" ]; then
          echo "ref=origin/$GITHUB_BASE_REF" >> "$GITHUB_OUTPUT"
        else
          echo "::error::No diff base: set 'diff_base' input or run on a pull_request event"
          exit 1
        fi

    - name: Install nitpik
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        REPO="nsrosenqvist/nitpik"
        if [ "$VERSION" = "latest" ]; then
          DOWNLOAD_URL="https://github.com/${REPO}/releases/latest/download/nitpik-x86_64-unknown-linux-gnu.tar.gz"
        else
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${VERSION}/nitpik-x86_64-unknown-linux-gnu.tar.gz"
        fi
        curl -sSfL "$DOWNLOAD_URL" | tar xz -C /usr/local/bin
        chmod +x /usr/local/bin/nitpik

    # Persist nitpik's result cache across runs so incremental review works on
    # ephemeral CI runners: unchanged files are reused (cache hit, no LLM call)
    # and changed files get the prior run's findings injected as context. Keyed
    # per branch, with a base-branch warm-start fallback. A no-op locally.
    - name: Restore nitpik cache
      uses: actions/cache@v4
      with:
        path: ~/.config/nitpik/cache
        key: nitpik-review-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
        restore-keys: |
          nitpik-review-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-
          nitpik-review-${{ runner.os }}-${{ github.base_ref }}-
          nitpik-review-${{ runner.os }}-

    - name: Run nitpik
      shell: bash
      env:
        # Exposed so `pr_review: true` (--format github-pr-review) can post
        # a PR review. Unused by the default annotation path.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        ARGS="${{ inputs.args }}"
        if [ -n "$ARGS" ]; then
          nitpik $ARGS
          exit $?
        fi

        CMD="nitpik review"
        CMD="$CMD --diff-base ${{ steps.base.outputs.ref }}"
        CMD="$CMD --profile ${{ inputs.profiles }}"
        if [ "${{ inputs.pr_review }}" = "true" ]; then
          CMD="$CMD --format github-pr-review"
        else
          CMD="$CMD --format github"
        fi

        if [ -n "${{ inputs.fail_on }}" ]; then
          CMD="$CMD --fail-on ${{ inputs.fail_on }}"
        fi

        if [ "${{ inputs.scan_secrets }}" = "true" ]; then
          CMD="$CMD --scan-secrets"
        fi

        AGENT_MODE="${{ inputs.agent }}"
        case "$AGENT_MODE" in
          true) AGENT_MODE="on" ;;
          false) AGENT_MODE="off" ;;
        esac
        CMD="$CMD --agent $AGENT_MODE"

        echo "::group::nitpik review"
        EXIT_CODE=0
        eval $CMD || EXIT_CODE=$?
        echo "::endgroup::"

        if [ "$EXIT_CODE" -ne 0 ]; then
          {
            echo "## :x: nitpik review failed"
            echo ""
            echo "The review step exited with code **${EXIT_CODE}**. Check the workflow logs for details."
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Provider | \`${NITPIK_PROVIDER:-not set}\` |"
            echo "| Model | \`${NITPIK_MODEL:-not set}\` |"
            echo ""
            echo "Common causes:"
            echo "- LLM provider returned an error (invalid API key, rate limit, model not found)"
            echo "- All review tasks failed after retries"
            echo "- \`--fail-on\` threshold was exceeded by findings"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$EXIT_CODE"
        fi
